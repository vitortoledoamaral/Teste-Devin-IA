# Configuração do Nginx para servir a aplicação Laravel
server {
    # Porta de escuta do servidor
    listen 80;
    
    # Nome do servidor (pode ser alterado conforme necessário)
    server_name localhost;
    
    # Diretório raiz da aplicação (pasta public do Laravel)
    root /var/www/public;
    
    # Arquivos de índice padrão
    index index.php index.html index.htm;

    # Configuração de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configuração principal de roteamento
    # Tenta servir o arquivo diretamente, se não existir, passa para o index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Configuração para processar arquivos PHP
    location ~ \.php$ {
        # Divide a URI para obter o script e path info
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Passa a requisição para o container PHP-FPM
        # 'app' é o nome do serviço definido no docker-compose.yml
        fastcgi_pass app:9000;
        
        # Arquivo de índice para FastCGI
        fastcgi_index index.php;
        
        # Inclui parâmetros padrão do FastCGI
        include fastcgi_params;
        
        # Define o script a ser executado
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Timeout para requisições longas
        fastcgi_read_timeout 300;
    }

    # Bloqueia acesso a arquivos ocultos (como .htaccess, .env)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Configuração de cache para arquivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
